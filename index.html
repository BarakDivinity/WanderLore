<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WanderLore</title>
  <!-- TailwindCSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Custom styling for premium look */
    body {
      font-family: 'Montserrat', sans-serif;
    }

    h1, h2, h3, .serif {
      font-family: 'Playfair Display', serif;
    }

    .bg-overlay {
      background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
    }

    .text-shadow {
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .btn-premium {
      background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%);
      box-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.4);
    }

    .btn-premium:hover {
      background: linear-gradient(135deg, #4338CA 0%, #2563EB 100%);
      box-shadow: 0 6px 18px 0 rgba(59, 130, 246, 0.5);
    }

  </style>
</head>

<body class="relative overflow-hidden bg-black">
  <!-- Premium background with overlay -->
  <div class="fixed inset-0 z-0">
    <video class="w-full h-full object-cover" autoplay muted loop playsinline>
      <source src="Videos/Background.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="absolute inset-0 bg-overlay"></div>
  </div>

  <!-- Header with logo -->
  <header class="fixed z-10 pt-6 px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center">
      <div class="text-white font-bold text-xl md:text-2xl tracking-wide serif">
        <span class="text-blue-400">Wander</span>Lore
      </div>
    </div>
  </header>

  <!-- Main Content with premium styling -->
  <div class="relative z-10 flex flex-col items-center justify-center min-h-screen text-center px-4 pt-16 pb-20">
    <div class="animate-fade">
      <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold mb-6 text-shadow max-w-4xl mx-auto leading-tight text-gray-100">
        Be the first to become a Certified Pro Guide with<span class="italic text-blue-400">WanderLore</span>
      </h1>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-12">
        <a href = "https://forms.gle/MDtNLEJ1RRttSTybA">
          <button id="registerBtn" class="btn-premium text-white font-semibold py-3 px-8 rounded-lg transition duration-300 transform hover:scale-105 flex items-center gap-2">
          <span>Apply Now</span>
          <i class="fas fa-arrow-right text-sm"></i>
        </button></a>

      </div>
    </div>
  </div>

</body>
</html>
