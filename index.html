<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WanderLore</title>
  <!-- TailwindCSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!--Arrow-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    /* Custom styling for premium look */
    body {
      font-family: 'Montserrat', sans-serif;
    }

    h1, h2, h3, .serif {
      font-family: 'Playfair Display', serif;
    }

    .bg-overlay {
      background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
    }

    .text-shadow {
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .btn-premium {
      background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
      box-shadow: 0 4px 14px 0 rgba(212, 175, 55, 0.4);
    }

    .btn-premium:hover {
      background: linear-gradient(135deg, #C5A021 0%, #A97406 100%);
      box-shadow: 0 6px 18px 0 rgba(212, 175, 55, 0.5);
    }

    .text-gold {
    color: #D4AF37;
    }

  </style>
</head>

<body class="relative overflow-hidden bg-black">
  <!-- Background with overlay -->
  <div class="fixed inset-0 z-0">
    <video class="w-full h-full object-cover" autoplay muted loop playsinline>
      <source src="Videos/Background.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="absolute inset-0 bg-overlay"></div>
  </div>

  <!-- Header with logo -->
  <header class="fixed z-10 pt-6 px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center">
      <div class="text-white font-bold text-xl md:text-2xl tracking-wide serif">
        Wander<span class= "text-gold">Lore</span>
      </div>
    </div>
  </header>

  <!-- Main Content-->
  <div class="relative z-10 flex flex-col items-center justify-center min-h-screen text-center px-4 pt-16 pb-20">
    <div>
      <h1 class="italic text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold mb-6 text-shadow max-w-4xl mx-auto leading-tight text-gray-100">
        Be the first to become a Certified Pro Guide with Wander<span class= "text-gold">Lore</span>
      </h1>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-12">
        <a href = "https://forms.gle/MDtNLEJ1RRttSTybA">
          <button id="registerBtn" class="btn-premium text-white font-semibold py-3 px-8 rounded-lg transition duration-300 transform hover:scale-105 flex items-center gap-2">
          <span>Apply Now</span>
          <i class="fas fa-arrow-right text-sm"></i>
        </button></a>

      </div>
    </div>
  </div>

</body>
</html>
